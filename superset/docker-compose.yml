services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - ./seed.pg.sql:/docker-entrypoint-initdb.d/seed.sql:ro
  superset:
    image: apache/superset:4.1.1
    depends_on: [db]
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: lab-only-change-me
    command: >
      bash -c "pip install --quiet psycopg2-binary==2.9.9 &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname a --lastname a --email a@example.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
